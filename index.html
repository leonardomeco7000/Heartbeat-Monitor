<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heartbeat Monitor</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body { font-family: Arial,sans-serif; max-width:1100px; margin:28px auto; padding:0 18px; }
h1 { margin-bottom:6px; }
.status { font-size:22px; margin:14px 0 20px; }
.grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; }
.box { border:1px solid #ccc; border-radius:8px; padding:12px; }
.box h3 { margin:0 0 7px; font-size:14px; opacity:.7; }
.value { font:22px monospace; }
.charts { display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:24px; }
.chartbox { border:1px solid #ccc; border-radius:8px; padding:14px; height:330px; }
canvas { width:100%!important; height:280px!important; }
table { width:100%; border-collapse:collapse; margin-top:24px; font-family:monospace; }
th,td { padding:6px 8px; border-bottom:1px solid #ddd; text-align:right; }
th:first-child,td:first-child { text-align:left; }
@media(max-width:800px) {
  .grid,.charts { grid-template-columns:1fr 1fr; }
}
</style>
</head>
<body>
<h1>Heartbeat Monitor</h1>
<div id="status" class="status">Avvio...</div>

<div class="grid">
  <div class="box">
    <h3>INVIO FE</h3>
    <div id="send" class="value">-</div>
  </div>
  <div class="box">
    <h3>RICEZIONE FE</h3>
    <div id="receive" class="value">-</div>
  </div>
  <div class="box">
    <h3>TIMESTAMP BE</h3>
    <div id="server" class="value">-</div>
  </div>
  <div class="box">
    <h3>ULTIMO RTT</h3>
    <div id="last" class="value">-</div>
  </div>
  <div class="box">
    <h3>MEDIA ULTIMI 20</h3>
    <div id="recentAvg" class="value">-</div>
  </div>
  <div class="box">
    <h3>MEDIA DALL'INIZIO</h3>
    <div id="globalAvg" class="value">-</div>
  </div>
  <div class="box">
    <h3>MIN / MAX</h3>
    <div id="minmax" class="value">-</div>
  </div>
  <div class="box">
    <h3>TIMEOUT</h3>
    <div id="timeouts" class="value">0</div>
  </div>
</div>

<div class="charts">
  <div class="chartbox">
    <canvas id="rttChart"></canvas>
  </div>
  <div class="chartbox">
    <canvas id="avgChart"></canvas>
  </div>
</div>

<table>
<thead>
<tr>
<th>#</th><th>Invio FE</th><th>BE</th><th>Ricezione FE</th><th>RTT</th>
</tr>
</thead>
<tbody id="history"></tbody>
</table>

<script>
const INTERVAL_MS = 1000;
const TIMEOUT_MS = 2000;
const RECENT_WINDOW = 20;

const results = [];
let sequence = 0;
let timeoutCount = 0;

const rttChart = new Chart(document.getElementById("rttChart"), {
    type: "line",
    data: {
        labels: [],
        datasets: [{
            label: "RTT (ms)",
            data: [],
            tension: 0.15,
            pointRadius: 2
        }]
    },
    options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        scales: { y: { beginAtZero: true } }
    }
});

const avgChart = new Chart(document.getElementById("avgChart"), {
    type: "line",
    data: {
        labels: [],
        datasets: [{
            label: "Media dall'inizio (ms)",
            data: [],
            tension: 0.15,
            pointRadius: 2
        }]
    },
    options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        scales: { y: { beginAtZero: true } }
    }
});

function average(values) {
    return values.length
        ? values.reduce((a,b) => a+b, 0) / values.length
        : 0;
}

function ms(v) {
    return Number.isFinite(v) ? v.toFixed(1) + " ms" : "-";
}

function updateView(r) {
    const all = results.map(x => x.rtt);
    const recent = all.slice(-RECENT_WINDOW);
    const globalAverage = average(all);

    document.getElementById("send").textContent =
        new Date(r.sentAt).toLocaleTimeString() + "." +
        String(r.sentAt % 1000).padStart(3,"0");

    document.getElementById("receive").textContent =
        new Date(r.receivedAt).toLocaleTimeString() + "." +
        String(r.receivedAt % 1000).padStart(3,"0");

    document.getElementById("server").textContent =
        new Date(r.serverAt).toLocaleTimeString() + "." +
        String(r.serverAt % 1000).padStart(3,"0");

    document.getElementById("last").textContent = ms(r.rtt);
    document.getElementById("recentAvg").textContent = ms(average(recent));
    document.getElementById("globalAvg").textContent = ms(globalAverage);
    document.getElementById("minmax").textContent =
        ms(Math.min(...all)) + " / " + ms(Math.max(...all));
    document.getElementById("timeouts").textContent = timeoutCount;

    document.getElementById("status").textContent =
        "♥ ALIVE — " + ms(r.rtt);

    // Grafico 1: andamento RTT.
    rttChart.data.labels.push(r.sequence);
    rttChart.data.datasets[0].data.push(r.rtt);

    // Grafico 2: media cumulativa dall'inizio.
    avgChart.data.labels.push(r.sequence);
    avgChart.data.datasets[0].data.push(globalAverage);

    // Mantieni grafici leggibili ma conserva tutte le misure nello storico JS.
    const MAX_POINTS = 120;
    if (rttChart.data.labels.length > MAX_POINTS) {
        rttChart.data.labels.shift();
        rttChart.data.datasets[0].data.shift();
        avgChart.data.labels.shift();
        avgChart.data.datasets[0].data.shift();
    }

    rttChart.update();
    avgChart.update();

    const row = document.createElement("tr");
    row.innerHTML = `
        <td>${r.sequence}</td>
        <td>${r.sentAt}</td>
        <td>${r.serverAt}</td>
        <td>${r.receivedAt}</td>
        <td>${ms(r.rtt)}</td>
    `;

    const history = document.getElementById("history");
    history.prepend(row);

    while (history.children.length > 50)
        history.removeChild(history.lastChild);
}

async function heartbeat() {
    const current = ++sequence;

    // performance.now() è monotono: usato per misurare la durata.
    const start = performance.now();
    const sentAt = Date.now();

    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);

    try {
        const response = await fetch(  "heartbeat", {
            cache: "no-store",
            signal: controller.signal
        });

        const data = await response.json();

        const end = performance.now();
        const receivedAt = Date.now();

        clearTimeout(timer);

        const result = {
            sequence: current,
            sentAt,
            serverAt: data.timestamp,
            receivedAt,
            rtt: end - start
        };

        results.push(result);
        updateView(result);

    } catch (error) {
        clearTimeout(timer);
        timeoutCount++;

        document.getElementById("timeouts").textContent = timeoutCount;
        document.getElementById("status").textContent =
            "✕ ALIVE NON RICEVUTO — connessione non confermata";
    }
}

heartbeat();
setInterval(heartbeat, INTERVAL_MS);
</script>
</body>
</html>
